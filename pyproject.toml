[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otop"
version = "1.1.0"
description = "htop/btop for Odoo -- a terminal monitor for Odoo workers, PostgreSQL and server resources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Ahmed Sajidh" }]
keywords = ["odoo", "monitoring", "top", "htop", "terminal", "tui", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.6",
    "PyYAML>=5.1",
]

[project.optional-dependencies]
# PostgreSQL panel; either driver works. On Debian/Ubuntu prefer the
# python3-psycopg2 package (that is what the .deb depends on).
postgres = ["psycopg2-binary>=2.8"]

[project.scripts]
otop = "otop.main:main"

[project.urls]
Homepage = "https://github.com/ahmedsajidh/otop"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "RET", "SIM"]
ignore = [
    # %-formatting is intentional: otop must run on the python3 of older
    # Debian/Ubuntu releases, and these are hot-path format calls.
    "UP031",
    # a monitor must never die because one metric failed; the broad excepts
    # and quiet passes below them are deliberate and always degrade to N/A.
    "BLE001", "S110",
    # contextlib.suppress() is slower than try/except/pass and these sit in
    # the per-process and per-cell drawing loops.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
